; Piglet — Waveshare ESP32-C5-Touch-LCD-3.5 port
;
; Self-contained, pinned C5 toolchain. Carries its own board manifest
; (boards/ws-c5-35.json), variant (variants/ws-c5-35), partition table, TFT_eSPI
; user setup and the ESP32-C5 processor patch — the same proven set the BSP's
; hello_board example uses — so it builds without inheriting any other project's
; toolchain.
;
; BSP dependency is pinned to an immutable Git commit in lib_deps below.
; The sibling BSP checkout is not used by this build.
;
; Console/flash: native USB-Serial-JTAG at 115200. If it will not auto-enter
; download mode: hold BOOT, tap RST, release BOOT, then upload.

[env:ws-c5-35]
; The C5 needs the pioarduino platform fork (stock espressif32 has no C5).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = ws-c5-35
framework = arduino
board_build.variants_dir = variants
board_build.partitions = partitions_ota_16mb.csv
monitor_speed = 115200
upload_speed = 460800

lib_deps =
    ; ESP32-C5 BSP — IMMUTABLE pin to the exact commit via its public repo.
    ; PlatformIO clones and checks out this SHA into .pio/libdeps (clean, not the
    ; mutable local ../ws-c5-bsp checkout). Reproducible given network on first
    ; fetch (cached after). Limitation: relies on the public repo staying up;
    ; for fully offline reproducibility, mirror the repo and point the URL at it.
    https://github.com/slickrick773/ESP32-C5-BSP.git#920a619ed0385529d5995a7fb4161279ddef6f00
    ; Exact versions verified to build (2026-11-02). See docs/VERIFICATION.md.
    bodmer/TFT_eSPI@2.5.43
    bblanchon/ArduinoJson@6.21.6
    mikalhart/TinyGPSPlus@1.1.0
    h2zero/NimBLE-Arduino@2.5.2

build_flags =
    -DUSER_SETUP_LOADED=1
    -include $PROJECT_DIR/wsc5_user_setup.h
    ; Route Arduino Serial to native USB-Serial-JTAG (board manifest defaults 0).
    -DARDUINO_USB_CDC_ON_BOOT=1

; Installs the ESP32-C5 processor port into TFT_eSPI after it is downloaded.
extra_scripts = pre:apply_c5_tft_patch.py

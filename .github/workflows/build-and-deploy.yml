name: Deploy web flasher

# Publishes web-flasher/ (ESP Web Tools install button on index.html, plus the
# esptool-js batch flasher on batch.html) to GitHub Pages.
#
# Firmware itself is built and published to GitHub Releases by
# release-firmware.yml (Piglet, TDongleC5_Piglet, PigletNode -- all
# esp32:esp32:XIAO_ESP32C5). The arduino-esp32 core's postobjcopy merge step
# already produces a single flashable <Sketch>.ino.merged.bin per board as
# part of that build, so this workflow does not rebuild anything -- it only
# ships the static site, which fetches those merged images straight from
# Hamspiced/piglet's latest published release at flash time (see the
# `RELEASE`/`REL` constants in index.html/batch.html).
#
# release-firmware.yml publishes each release immediately (not as a draft),
# so GitHub's "latest" release resolves to it as soon as that workflow
# finishes -- no manual publish step needed before the web flasher works.
#
# Runs on a version tag (v*) and on manual dispatch. The first run turns
# Pages on automatically (configure-pages enablement) -- no Settings toggle
# needed.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let a newer run supersede an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy web-flasher to Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stamp version
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}+${GITHUB_SHA::7}"
          echo "Stamping version: $VERSION"
          # Substitute __VERSION__ in the flasher pages' footers.
          find web-flasher -name '*.html' | while read -r f; do
            sed -i "s|__VERSION__|${VERSION}|g" "$f"
          done

      - uses: actions/configure-pages@v5
        with:
          # Turn Pages on (source = GitHub Actions) on the first run, so no
          # manual toggle in Settings is needed.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web-flasher

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
